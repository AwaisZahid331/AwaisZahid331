</defs><g clip-path="url(#card)"><rect width="1200" height="420" fill="url(#bg)"/><rect width="1200" height="420" fill="url(#dots)"/><rect width="1200" height="420" fill="url(#glow)"/><rect width="1200" height="420" fill="url(#glow2)"/></g><rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="21.5" fill="none" stroke="#ff5c97" stroke-opacity="0.22" stroke-width="1.5"/><rect x="56" y="40" width="249" height="32" rx="16" fill="#fff" fill-opacity="0.04" stroke="#ff5c97" stroke-opacity="0.35"/><circle cx="75" cy="56" r="4.3" fill="#ff5c97" class="live"/><text x="88" y="61" class="mono" font-size="13.5" fill="#e9c6d6">~/awais <tspan fill="#ff5c97">$</tspan> cat about.md</text><rect x="285" y="48" width="7.5" height="16" fill="#ff5c97" class="cursor"/><line x1="58" y1="107" x2="88" y2="107" stroke="#ff5c97" stroke-width="2"/><text x="100" y="112" class="mono" font-size="12.5" letter-spacing="3.6" fill="#ff7aa9">01  ·  ABOUT</text><text x="54" y="166" class="serif" font-size="46" font-weight="700" fill="#fff">Hey, I'm Awais<tspan fill="#ff5c97">.</tspan></text><text x="58" y="210" class="sans" font-size="16.5" fill="#eadbe3">Full Stack AI Developer based in Lahore. I build systems where LLMs do</text><text x="58" y="237" class="sans" font-size="16.5" fill="#eadbe3">real work: agents that reason, take action, and recover when something</text><text x="58" y="264" class="sans" font-size="16.5" fill="#eadbe3">breaks. Right now I&#x27;m a Software Engineer at CBSOL, shipping multi-</text><text x="58" y="291" class="sans" font-size="16.5" fill="#eadbe3">agent workflows, RAG pipelines and AI-integrated full stack apps on</text><text x="58" y="318" class="sans" font-size="16.5" fill="#eadbe3">AWS. I also led development as Team Lead on PXEngine.</text><text x="58" y="359" class="mono" font-size="13" fill="#9c7f8d"><tspan fill="#ff5c97">▸</tspan> Building autonomous agents and multi-agent orchestration</text><text x="58" y="385" class="mono" font-size="13" fill="#9c7f8d"><tspan fill="#ff5c97">▸</tspan> Working daily with Claude Code, Cursor and MCP servers</text><rect x="790" y="76" width="172" height="132" rx="16" fill="#fff" fill-opacity="0.03" stroke="#ff5c97" stroke-opacity="0.25"/><text x="810" y="138" class="serif" font-size="46" font-weight="700" fill="#fff">3</text><text x="810" y="168" class="mono" font-size="11" letter-spacing="1.6" fill="#ff7aa9">YEARS IN</text><text x="810" y="186" class="mono" font-size="11" letter-spacing="1.6" fill="#ff7aa9">PRODUCTION</text><rect x="980" y="76" width="172" height="132" rx="16" fill="#fff" fill-opacity="0.03" stroke="#ff5c97" stroke-opacity="0.25"/><text x="1000" y="138" class="serif" font-size="46" font-weight="700" fill="#fff">5+</text><text x="1000" y="168" class="mono" font-size="11" letter-spacing="1.6" fill="#ff7aa9">PRODUCTS</text><text x="1000" y="186" class="mono" font-size="11" letter-spacing="1.6" fill="#ff7aa9">SHIPPED</text><rect x="790" y="226" width="172" height="132" rx="16" fill="#fff" fill-opacity="0.03" stroke="#ff5c97" stroke-opacity="0.25"/><text x="810" y="288" class="serif" font-size="46" font-weight="700" fill="#fff">60%</text><text x="810" y="318" class="mono" font-size="11" letter-spacing="1.6" fill="#ff7aa9">FASTER</text><text x="810" y="336" class="mono" font-size="11" letter-spacing="1.6" fill="#ff7aa9">WORKFLOWS</text><rect x="980" y="226" width="172" height="132" rx="16" fill="#fff" fill-opacity="0.03" stroke="#ff5c97" stroke-opacity="0.25"/><text x="1000" y="288" class="serif" font-size="46" font-weight="700" fill="#fff">500+</text><text x="1000" y="318" class="mono" font-size="11" letter-spacing="1.6" fill="#ff7aa9">CONCURRENT</text><text x="1000" y="336" class="mono" font-size="11" letter-spacing="1.6" fill="#ff7aa9">USERS</text></svg>