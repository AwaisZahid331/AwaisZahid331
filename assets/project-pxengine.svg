<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="PXEngine project"><title>PXEngine project</title><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0710"/><stop offset="0.55" stop-color="#160a13"/><stop offset="1" stop-color="#1f0818"/></linearGradient>
  <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6"><stop offset="0" stop-color="#e0336f" stop-opacity="0.26"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="0.05" cy="1" r="0.5"><stop offset="0" stop-color="#7a1fd1" stop-opacity="0.16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
