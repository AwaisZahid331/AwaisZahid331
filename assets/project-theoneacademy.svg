<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="TheOneAcademy project"><title>TheOneAcademy project</title><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0710"/><stop offset="0.55" stop-color="#160a13"/><stop offset="1" stop-color="#1f0818"/></linearGradient>
  <radialGradient id="glow" cx="0.95" cy="0.05" r="0.6"><stop offset="0" stop-color="#e0336f" stop-opacity="0.26"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="0.05" cy="1" r="0.5"><stop offset="0" stop-color="#7a1fd1" stop-opacity="0.16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity="0.045"/></pattern>
  <clipPath id="card"><rect width="600" height="330" rx="22"/></clipPath>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .serif{font-family:Georgia,'Times New Roman',Times,serif}
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .cursor{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
    .live{animation:live 2s ease-in-out infinite} @keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
    .rise{animation:rise .8s ease-out both} @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  </style>
</defs><g clip-path="url(#card)"><rect width="600" height="330" fill="url(#bg)"/><rect width="600" height="330" fill="url(#dots)"/><rect width="600" height="330" fill="url(#glow)"/><rect width="600" height="330" fill="url(#glow2)"/></g><rect x="0.75" y="0.75" width="598.5" height="328.5" rx="21.5" fill="none" stroke="#ff5c97" stroke-opacity="0.22" stroke-width="1.5"/><text x="36" y="54" class="mono" font-size="13" letter-spacing="2" fill="#ff5c97">05</text><line x1="66" y1="49" x2="96" y2="49" stroke="#ff5c97" stroke-opacity="0.6"/><text x="108" y="54" class="mono" font-size="12" letter-spacing="2.4" fill="#ff7aa9">FULL STACK LMS</text><text x="34" y="110" class="serif" font-size="38" font-weight="700" fill="#fff">TheOneAcademy<tspan fill="#ff5c97">.</tspan></text><text x="36" y="150" class="sans" font-size="15.5" fill="#eadbe3">Production learning platform with role-based access</text><text x="36" y="175" class="sans" font-size="15.5" fill="#eadbe3">control, Drizzle ORM on PostgreSQL and optimized REST</text><text x="36" y="200" class="sans" font-size="15.5" fill="#eadbe3">APIs.</text><text x="36" y="262" class="serif" font-size="40" font-weight="700" fill="#fff">500+</text><text x="36" y="290" class="mono" font-size="11" letter-spacing="1.8" fill="#ff7aa9">CONCURRENT USERS</text><rect x="250" y="252" width="63" height="26" rx="13.0" fill="#ff5c97" fill-opacity="0.05" stroke="#ff5c97" stroke-opacity="0.38"/><text x="282" y="269.1" text-anchor="middle" class="mono" font-size="11.5" fill="#f3dbe6">React</text><rect x="321" y="252" width="77" height="26" rx="13.0" fill="#ff5c97" fill-opacity="0.05" stroke="#ff5c97" stroke-opacity="0.38"/><text x="360" y="269.1" text-anchor="middle" class="mono" font-size="11.5" fill="#f3dbe6">Node.js</text><rect x="250" y="286" width="98" height="26" rx="13.0" fill="#ff5c97" fill-opacity="0.05" stroke="#ff5c97" stroke-opacity="0.38"/><text x="299" y="303.1" text-anchor="middle" class="mono" font-size="11.5" fill="#f3dbe6">PostgreSQL</text><rect x="356" y="286" width="77" height="26" rx="13.0" fill="#ff5c97" fill-opacity="0.05" stroke="#ff5c97" stroke-opacity="0.38"/><text x="395" y="303.1" text-anchor="middle" class="mono" font-size="11.5" fill="#f3dbe6">Drizzle</text></svg>